sentence=Robot library for MyMINI 16Pro (RP2350 Pico2) with BNO086 IMU, dual 16-channel line sensors, DRV8874/TB6612 motors and PCF8574 LEDs.
paragraph=Includes 16+16 MUX line sensors, ADS1115 center sensors, calibration stored in CAT24C128 EEPROM (with flash backup), battery monitor, motor drivers, buzzer, LED effects, servo arm, PID line following with junction commands and BNO08x gyro turns / straight runs (commands from MyRP_Pico2_mini_BNO086, 16-sensor indexing after UnknowRobot_STORMXII_V3).
