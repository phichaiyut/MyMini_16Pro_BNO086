sentence=Header-only MyMINI 16Pro (RP2350 Pico 2) robot library with the full MyRP_Pico2_mini_BNO086 API on MyMINI_16Pro hardware and a BNO086 gyro.
paragraph=Hardware layer from MyMINI_16Pro (DRV8874 / TB6612FNG 12-bit PWM at 15/20 kHz, dual 16-channel MUX sensors on GP27/GP26, ADS1115 center sensors and battery, MCP3421 ADCcal, PCF8574 LEDs, CAT24C128 calibration compatible with MyMINI_16Pro, tone() buzzer on GP9, START/CAL buttons, servos on GP18/GP22/GP28/GP0/GP1). Lowercase commands (ff, ffc, ffcmg, ffdir, spindir, rotatedir ...) follow MyRP_Pico2_mini_BNO086 including its gyro engine. BNO086 on Wire (GP4/GP5, 100 kHz).
